MED</b><small>BBA-101026-FERNANDO</small></div></div></div>\n<div class="card"><h3>Booking confirmation sent</h3><div class="pad"><div class="email"><div class="eh"><div><b>FROM</b>Barcelona Boys Agency &lt;booking@barcelonaboys-agency.com&gt;</div><div><b>TO</b>Fernando</div><div><b>SUBJECT</b>Booking Confirmed — Groom Special — 10 October 2026</div></div>\n<div class="eb"><div class="brand">BARCELONA BOYS AGENCY</div><p>Dear Fernando,</p><p style="margin-top:12px">We are pleased to confirm your upcoming performance with Barcelona Boys Agency.</p><p style="margin-top:12px">Your booking details are below:</p>\n<table><tr><td>Reference</td><td><b>BBA-101026-FERNANDO</b></td></tr><tr><td>Show</td><td>Groom Special · 30 minutes</td></tr><tr><td>Date</td><td>Saturday, 10 October 2026 · 18:30</td></tr><tr><td>Location</td><td>Barcelona, Spain</td></tr><tr><td>Guests</td><td>6</td></tr><tr><td>Payment</td><td>€250 · Paid by organiser</td></tr></table>\n<p>Please arrive performance-ready. Meeting point details will be provided separately by the organiser.</p><p style="margin-top:12px">Kind regards,<br><b>Clara</b><br>Private Events Coordinator<br>Barcelona Boys Agency</p><small>This message is confidential and intended solely for the named recipient. Booking contact details remain confidential.</small></div></div>\n<div style="text-align:center;margin-top:28px" class="no-print"><button class="btn gold" id="pdf">Download Booking Confirmation</button></div></div></div>\n<div class="card"><h3>Your booking team</h3><div class="team"><div class="avatar">C</div><div><b>Clara</b><div style="color:var(--gold);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:4px 0">Barcelona Boys Agency · Private Events Coordinator</div><div style="color:var(--mut);font-style:italic;font-family:\'Cormorant Garamond\',serif;font-size:20px">Thank you for choosing Barcelona Boys Agency.</div></div></div></div></div>';

 document.getElementById('pdf').onclick=makePdf;try{sessionStorage.setItem('bba_conf','1')}catch(e){}}

 d.setFillColor(10,9,8);d.rect(0,0,210,48,'F');d.setDrawColor(201,164,92);d.setLineWidth(.6);d.line(0,48,210,48);
 d.setTextColor(201,164,92);d.setFont('times','bold');d.setFontSize(24);d.text('BARCELONA BOYS AGENCY',105,24,{align:'center',charSpace:1.5});
 d.setFont('helvetica','normal');d.setFontSize(8);d.text("BARCELONA'S PRIVATE MALE ENTERTAINMENT AGENCY",105,32,{align:'center',charSpace:1});
 d.setFontSize(8);d.text('Private Events Department  ·  booking@barcelonaboys-agency.com  ·  Mon–Sun 10:00–00:00',105,40,{align:'center'});
 d.setTextColor(20,20,20);d.setFont('times','bold');d.setFontSize(26);d.text('BOOKING CONFIRMATION',105,72,{align:'center'});
 d.setFont('helvetica','normal');d.setFontSize(11);d.setTextColor(110,110,110);d.text('Booking reference',105,84,{align:'center'});
 d.setFont('courier','bold');d.setFontSize(17);d.setTextColor(150,110,40);d.text('BBA-101026-FERNANDO',105,93,{align:'center'});

 let y=120;rows.forEach((r,i)=>{if(i%2==0){d.setFillColor(247,244,238);d.rect(25,y-6,160,11,'F')}d.setFont('helvetica','bold');d.setFontSize(8.5);d.setTextColor(140,110,50);d.text(r[0],30,y,{charSpace:.6});d.setFont('helvetica','normal');d.setFontSize(11);d.setTextColor(25,25,25);d.text(r[1],85,y);y+=11});
 d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(140,110,50);d.text('PERFORMER INSTRUCTIONS',30,y+8,{charSpace:.6});d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(40,40,40);
 d.text(d.splitTextToSize('Fernando is requested to arrive performance-ready. The organiser will provide the final meeting point separately.',150),30,y+15);
 d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(140,110,50);d.text('BOOKING CONDITIONS',30,y+32,{charSpace:.6});d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(40,40,40);
 ['Performance duration: 30 minutes','Private event','Professional performance','Performer arrival instructions provided separately','Booking contact remains confidential'].forEach((t,i)=>d.text('•  '+t,30,y+39+i*6));
 d.setDrawColor(201,164,92);d.setLineWidth(1.2);d.circle(160,y+58,17);d.setLineWidth(.3);d.circle(160,y+58,15);d.setTextColor(170,130,50);d.setFont('times','bold');d.setFontSize(11);d.text('BOOKING',160,y+56,{align:'center'});d.text('CONFIRMED',160,y+62,{align:'center'});
 d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(90,90,90);d.text('Clara · Private Events Coordinator · Barcelona Boys Agency',30,y+80);d.text('Thank you for choosing Barcelona Boys Agency.',30,y+86);
 d.setFillColor(10,9,8);d.rect(0,281,210,16,'F');d.setTextColor(201,164,92);d.setFontSize(7.5);d.text('Barcelona Boys Agency S.L.  ·  Barcelona, Spain  ·  This document is confidential',105,290,{align:'center'});

$('bf').addEventListener('submit',e=>{e.preventDefault();
 if(!$('nm').value.trim()||!$('em').value.trim()){BBA.toast('Please complete the required fields.');return}
