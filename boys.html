<section class="page-hero"><div class="wrap center"><div class="eyebrow">The catalogue</div><h1>OUR BOYS</h1><div class="rule"></div><p class="sub">Meet the performers behind Barcelona's most memorable private shows.</p></div></section><section style="padding-top:40px"><div class="wrap"><div class="filters" id="fl"><button class="chip on" data-f="all">All</button><button class="chip" data-f="classic">Classic</button><button class="chip" data-f="groom">Groom shows</button><button class="chip" data-f="vip">VIP</button><button class="chip" data-f="latin">Latin</button><button class="chip" data-f="dance">Dance / Fitness</button></div><div class="boys" id="bs"></div></div></section>
<script src="assets/js/main.js"></script>
<script>const bs=document.getElementById('bs');bs.innerHTML=BBA.boys.map(BBA.card).join('');BBA.observe();
document.getElementById('fl').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');bs.querySelectorAll('.boy').forEach(a=>{a.style.display=(c.dataset.f==='all'||a.dataset.tags.includes(c.dataset.f))?'':'none'})}</script>
